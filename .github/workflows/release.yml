name: Release

# Push a tag like v0.1.1 to build, test, pack and publish a GitHub Release (see RELEASING.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Optional code signing: both secrets set -> files are signed; otherwise the step is skipped (unsigned build).
      SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag (v0.1.1 -> 0.1.1)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '${{ github.ref_name }}' is not vMAJOR.MINOR.PATCH" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PRERELEASE=$($version.Contains('-'))" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore DualAudio.sln

      - name: Build (Release)
        run: dotnet build DualAudio.sln -c Release --no-restore -p:Version=${{ env.VERSION }}

      - name: Test
        run: dotnet test DualAudio.sln -c Release --no-build --filter "Category!=Hardware" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Restore tools (vpk)
        run: dotnet tool restore

      # The previous release's package lets vpk build a small delta update. Nothing to fetch on the first release.
      - name: Download previous release (for delta updates)
        continue-on-error: true
        shell: pwsh
        run: dotnet vpk download github --repoUrl $env:REPO_URL --token ${{ secrets.GITHUB_TOKEN }} --outputDir releases

      - name: Code-signing certificate (optional)
        if: env.SIGN_CERT_BASE64 != '' && env.SIGN_CERT_PASSWORD != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_BASE64))
          "SIGN_PARAMS=/f `"$pfx`" /p $env:SIGN_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish and pack (Setup.exe, portable zip, update feed)
        shell: pwsh
        run: ./build/pack.ps1 -Version $env:VERSION -OutputDir releases -SignParams "$env:SIGN_PARAMS"

      - name: Create the GitHub Release and upload assets
        shell: pwsh
        run: |
          $upload = @('vpk', 'upload', 'github', '--repoUrl', $env:REPO_URL, '--token', '${{ secrets.GITHUB_TOKEN }}',
                    '--outputDir', 'releases', '--tag', '${{ github.ref_name }}',
                    '--releaseName', "DualAudio $env:VERSION", '--publish')
          if ($env:PRERELEASE -eq 'True') { $upload += '--pre' }
          dotnet @upload
          if ($LASTEXITCODE) { throw 'vpk upload failed' }

      - name: Release notes (generated by GitHub)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name='${{ github.ref_name }}' --jq .body
          $file = Join-Path $env:RUNNER_TEMP 'notes.md'
          Set-Content -Path $file -Value $notes -Encoding utf8
          gh release edit '${{ github.ref_name }}' --notes-file $file

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'sign.pfx') -ErrorAction SilentlyContinue
