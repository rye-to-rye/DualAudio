<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Windows taskbar corner: 1, click the up arrow to show hidden icons; 2, click the DualAudio icon for quick controls; 3, right-click it and choose Exit to quit." xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="720" height="400" rx="16" fill="#0b0d10"/>
  <!-- taskbar -->
  <rect x="0" y="344" width="720" height="56" fill="#1b1f26"/>
  <rect x="0" y="344" width="720" height="1" fill="#2a2f38"/>
  <!-- chevron button (highlighted) -->
  <rect x="470" y="354" width="36" height="36" rx="8" fill="#14171c" stroke="#7c9cff" stroke-width="2"/>
  <path d="M480 376 L488 368 L496 376" fill="none" stroke="#e8eaed" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- wifi / speaker / battery -->
  <g fill="none" stroke="#a9b0bb" stroke-width="2" stroke-linecap="round">
    <path d="M522 370 a14 14 0 0 1 20 0 M526 375 a8 8 0 0 1 12 0"/><circle cx="532" cy="380" r="1.5" fill="#a9b0bb"/>
    <path d="M556 367 h4 l6 -5 v18 l-6 -5 h-4 z" stroke-linejoin="round"/><path d="M571 366 a7 7 0 0 1 0 12"/>
    <rect x="584" y="365" width="20" height="11" rx="2"/><path d="M606 369 v3"/>
  </g>
  <text x="664" y="368" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#e8eaed">12:00</text>
  <text x="664" y="385" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#a9b0bb">Today</text>

  <!-- hidden icons popup -->
  <rect x="404" y="214" width="168" height="112" rx="10" fill="#14171c" stroke="#2a2f38"/>
  <g fill="#2a2f38"><rect x="422" y="230" width="36" height="36" rx="8"/><rect x="470" y="230" width="36" height="36" rx="8"/><rect x="518" y="230" width="36" height="36" rx="8"/><rect x="518" y="276" width="36" height="36" rx="8"/></g>
  <!-- DualAudio icon in popup -->
  <rect x="466" y="272" width="44" height="44" rx="11" fill="none" stroke="#7c9cff" stroke-width="2.5"/>
  <g transform="translate(470 276) scale(0.0703)">
    <rect width="512" height="512" rx="112" fill="#0b0d10"/>
    <path d="M140 116 H244 A140 140 0 0 1 244 396 H140 Z" fill="none" stroke="#e8eaed" stroke-width="48" stroke-linejoin="round"/>
    <rect x="206" y="196" width="36" height="120" rx="18" fill="#7c9cff"/>
    <rect x="270" y="166" width="36" height="180" rx="18" fill="#7c9cff"/>
  </g>

  <!-- right-click menu -->
  <path d="M466 294 H352" stroke="#7c9cff" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="132" y="92" width="220" height="234" rx="10" fill="#14171c" stroke="#2a2f38"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="15" fill="#e8eaed">
    <text x="152" y="124">Disconnect</text>
    <text x="152" y="160">Mute phone audio</text>
    <text x="152" y="196">Open DualAudio</text>
    <text x="152" y="232">Settings</text>
  </g>
  <rect x="144" y="250" width="196" height="1" fill="#2a2f38"/>
  <rect x="140" y="262" width="204" height="40" rx="8" fill="#7c9cff" fill-opacity="0.18" stroke="#7c9cff"/>
  <text x="152" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" fill="#e8eaed">Exit</text>

  <!-- numbered badges -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0b0d10">
    <circle cx="506" cy="352" r="12" fill="#7c9cff"/><text x="506" y="357">1</text>
    <circle cx="512" cy="270" r="12" fill="#7c9cff"/><text x="512" y="275">2</text>
    <circle cx="340" cy="262" r="12" fill="#7c9cff"/><text x="340" y="267">3</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
