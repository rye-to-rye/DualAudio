name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DualAudio.sln

      - name: Build (Release)
        run: dotnet build DualAudio.sln -c Release --no-restore

      # Hardware tests need a Bluetooth adapter and a paired phone; they are tagged Category=Hardware.
      - name: Test
        run: dotnet test DualAudio.sln -c Release --no-build --filter "Category!=Hardware" --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
